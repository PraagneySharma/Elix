services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: veronica
      POSTGRES_USER: veronica
      POSTGRES_PASSWORD: veronica
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veronica -d veronica"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - veronica-postgres:/var/lib/postgresql/data

  relay:
    build:
      context: .
    environment:
      NODE_ENV: development
      ELIX_BIND_HOST: 0.0.0.0
      PORT: 39100
      DATABASE_URL: postgres://veronica:veronica@postgres:5432/veronica
      ELIX_PUBLIC_ORIGIN: ${ELIX_PUBLIC_ORIGIN:-http://localhost:39100}
      ELIX_AUTH0_ISSUER: ${ELIX_AUTH0_ISSUER:-https://example.auth0.com/}
      ELIX_AUTH0_AUDIENCE: ${ELIX_AUTH0_AUDIENCE:-https://mcp.elix.test/}
      ELIX_AUTH0_ALLOWED_SUBJECT_PREFIXES: ${ELIX_AUTH0_ALLOWED_SUBJECT_PREFIXES:-google-oauth2|}
    ports:
      - "127.0.0.1:39100:39100"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - sh
      - -c
      - node apps/relay/dist/src/migrate.js && exec node apps/relay/dist/src/index.js
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:39100/healthz').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  veronica-postgres:
